new-session 1
new-window -c $HOME/code/c/termbudget/src -n C/PROJECT -t 2
new-window -c $HOME/code/c/practice -n C/EXPERIMENT -t 3
new-window -c $HOME -n \$HOME -t 4
new-window -c $HOME/code/python -n PYTHON -t 5
kill-window -t 0
new-window -c $HOME/code/c/termbudget -n SCRATCHPAD -t 0

set -g default-terminal "tmux-256color"
set -g xterm-keys on
set -g history-limit 50000
set-option -g focus-events on
set-option -g escape-time 50
set-option -sa terminal-features ',xterm-256color:RGB'
#set -g base-index 1 # start windows numbering at 1

bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U
bind ^x resize-pane -x 25%
bind ^y resize-pane -y 25%
bind '=' resize-pane -x 50%
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Set status line, windows, pane and message colors.
set -g message-style "bg=#1c1c1c,fg=#9c9c9c"
set -g pane-active-border-style "bg=default,fg=#7aa2f7"
set -g pane-border-style "bg=default,fg=#303030"

set -g status-style "bg=default ,fg=#414868"

setw -g window-status-activity-style none
setw -g window-status-current-style "bg=default ,fg=#ff9e64"
